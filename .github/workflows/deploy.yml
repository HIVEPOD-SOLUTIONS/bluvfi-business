name: Deploy

# Builds the Docker image, pushes it to Docker Hub and runs it on the EC2 Ubuntu server over SSH.
# It runs only after CI (lint, type check, tests, demo, build) passes on main, or by hand from the Actions tab.
# Pull requests never deploy. Server setup and the secrets it needs: docs/DEPLOY.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer one waits for the running one instead of cutting it off half way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: bluvfi-business
  CONTAINER: bluvfi-business

jobs:
  build-and-push:
    # A CI run that passed on a push to main (not a pull request that happens to come from a branch named main), or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only the commit SHA crosses jobs: GitHub drops a job output that contains a secret, such as the Docker Hub username.
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout the commit CI checked
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image name
        id: meta
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: GIT_SHA=${{ steps.meta.outputs.sha }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.meta.outputs.image }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Settings > Environments > production: add required reviewers there to approve each deploy by hand.
    environment: production
    steps:
      - name: Deploy to the Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        env:
          # The exact image built above, never a stale :latest on the server.
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.sha }}
          CONTAINER: ${{ env.CONTAINER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          APP_DIR: ${{ vars.APP_DIR || '/home/ubuntu/bluvfi' }}
          APP_PORT: ${{ vars.APP_PORT || '3000' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,CONTAINER,DOCKER_USERNAME,DOCKER_PASSWORD,APP_DIR,APP_PORT
          script: |
            # Fail the job on any error instead of carrying on with a broken deploy.
            set -eo pipefail
            echo "Deploying $IMAGE at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            # Server files (made by scripts/ec2-setup.sh): settings and records live on the host, so a redeploy keeps them.
            #   $APP_DIR/.env.local  the app's settings and secrets (empty for the hosted demo)
            #   $APP_DIR/docker.env  container settings: BLUVFI_DEMO=1 serves the demo
            #   $APP_DIR/data/       the records (payments, policies, proofs): back this folder up
            mkdir -p "$APP_DIR/data"
            touch "$APP_DIR/.env.local" "$APP_DIR/docker.env"
            chmod 600 "$APP_DIR/.env.local"
            # The container runs as uid 1000 ("node"); it must be able to write its records and, during setup, .env.local.
            sudo chown -R 1000:1000 "$APP_DIR/data" "$APP_DIR/.env.local"

            # Pull before touching the running container, so a failed pull leaves the current deployment up.
            echo "$DOCKER_PASSWORD" | sudo docker login -u "$DOCKER_USERNAME" --password-stdin
            sudo docker pull "$IMAGE"
            sudo docker logout

            PREVIOUS=$(sudo docker inspect -f '{{.Config.Image}}' "$CONTAINER" 2>/dev/null || true)

            start() {
              sudo docker run -d \
                --name "$CONTAINER" \
                --restart unless-stopped \
                --stop-timeout 30 \
                -p "127.0.0.1:${APP_PORT}:3000" \
                --env-file "$APP_DIR/docker.env" \
                -v "$APP_DIR/.env.local:/app/.env.local" \
                -v "$APP_DIR/data:/app/.data" \
                --log-opt max-size=10m --log-opt max-file=5 \
                "$1"
            }

            healthy() {
              # Up to 3 minutes: the demo seeds its records before the server starts.
              for i in $(seq 1 90); do
                STATE=$(sudo docker inspect -f '{{.State.Status}}' "$CONTAINER")
                if [ "$STATE" != "running" ]; then echo "Container is $STATE"; return 1; fi
                CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/api/health" || true)
                if [ "$CODE" = 200 ]; then echo "Health check passed"; return 0; fi
                sleep 2
              done
              echo "No healthy answer from /api/health within 3 minutes (last HTTP $CODE)"
              return 1
            }

            echo "Stopping the running container..."
            sudo docker stop "$CONTAINER" >/dev/null 2>&1 || true
            sudo docker rm "$CONTAINER" >/dev/null 2>&1 || true

            echo "Starting $IMAGE..."
            start "$IMAGE"
            if ! healthy; then
              sudo docker logs --tail 80 "$CONTAINER" || true
              if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$IMAGE" ]; then
                echo "Rolling back to $PREVIOUS"
                sudo docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
                start "$PREVIOUS"
                healthy || echo "The previous image is not healthy either: check the server"
              fi
              exit 1
            fi

            echo "Running image: $(sudo docker inspect -f '{{.Config.Image}}' "$CONTAINER")"
            sudo docker logs --tail 20 "$CONTAINER"
            # Remove images unused for 3 days; the one just replaced stays, so a manual rollback is one docker run away.
            sudo docker image prune -af --filter "until=72h" >/dev/null || true
            echo "Deployment completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
