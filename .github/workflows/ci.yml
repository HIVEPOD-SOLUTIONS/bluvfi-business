name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (outside services are local fakes; no keys, no network spend)
        run: npm test
      - name: Demo (the judge's path; exits non-zero if any scenario fails)
        run: npm run demo
      - name: Production build
        run: npm run build
      - name: Dependency audit (fails on critical findings in what ships)
        run: npm audit --omit=dev --audit-level=critical

  docker:
    # The deploy image builds on every pull request too, so a broken Dockerfile is caught before it reaches main.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Docker image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bluvfi-business:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the hosted demo from the image and check /api/health
        run: |
          docker run -d --name app -e BLUVFI_DEMO=1 -p 3000:3000 bluvfi-business:ci
          for i in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)" = 200 ]; then
              curl -s http://127.0.0.1:3000/api/health; echo; exit 0
            fi
            sleep 2
          done
          docker logs --tail 80 app
          exit 1
